    <script>
        try {
            document.documentElement.dataset.tema = localStorage.getItem('bingoTema') || 'classico';
            document.documentElement.dataset.marcador = localStorage.getItem('bingoCorMarcador') || 'vermelho';
        } catch (erro) {
            document.documentElement.dataset.tema = 'classico';
            document.documentElement.dataset.marcador = 'vermelho';
        }
    </script>

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--page-bg);
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background: var(--page-bg);
            color: var(--page-text);
            margin: 0;
            padding: 15px;
            transition: background-color 0.22s ease, color 0.22s ease;
        }

        .fundo-bingo {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            color: var(--accent);
            opacity: var(--pattern-opacity);
            transition: color 0.22s ease, opacity 0.22s ease;
        }

        .controles-topo, #container-virtual, #container-manual, .tema-area {
            position: relative;
            z-index: 1;
        }

        .controles-topo {
            position: relative;
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 500px;
            justify-content: space-between;
        }

        button, .input-file-btn {
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            background: var(--control-bg);
            color: var(--control-text);
            border: none;
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.18s, filter 0.18s, box-shadow 0.18s;
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.22);
            -webkit-tap-highlight-color: transparent;
        }

        button svg, .input-file-btn svg {
            width: 19px;
            height: 19px;
            flex: 0 0 19px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        button:hover, .input-file-btn:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        button:active, .input-file-btn:active {
            transform: translateY(1px);
        }

        button:focus-visible, .input-file-btn:focus-visible, input:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }

        #btnDesfazer, #btnDesfazerVirtual {
            background: var(--undo-bg);
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.24);
        }

        #btnLimpar {
            color: var(--clear-text);
            background: var(--clear-bg);
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.22);
        }

        .input-file-btn svg {
            color: var(--control-icon);
        }

        #btnLimpar svg {
            color: var(--clear-icon);
        }

        .input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* MODO MANUAL: dimensões funcionais preservadas */
        #container-manual {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            align-items: center;
        }

        canvas {
            box-sizing: content-box;
            width: 90vw;
            height: 90vw;
            max-width: 500px;
            max-height: 500px;
            border: 3px solid var(--canvas-border);
            border-radius: 18px;
            background-color: #fff;
            touch-action: none;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.34);
        }

        .controles-baixo {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 15px;
            gap: 12px;
        }

        .ferramentas-pincel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--tool-bg);
            padding: 10px 15px 5px 15px;
            border-radius: 20px;
            box-shadow: inset 0 0 0 1px var(--panel-border), 0 6px 16px rgba(0,0,0,0.22);
        }

        .seletor-tamanho {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .btn-tamanho {
            box-sizing: content-box;
            min-height: 35px;
            background: none;
            border: 2px solid transparent;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            box-shadow: none;
        }

        .pincel-icone {
            background-color: var(--brush-color);
            border-radius: 50%;
            display: inline-block;
            opacity: 0.92;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.34);
        }

        .btn-tamanho.ativo {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: var(--brush-active);
        }

        .slider-personalizado {
            width: 100%;
            cursor: pointer;
            height: 6px;
            background: var(--slider-track);
            border-radius: 5px;
            outline: none;
            -webkit-appearance: none;
            margin-bottom: 22px;
        }

        .slider-personalizado::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 28px;
            border-radius: 5px;
            background: var(--brush-color);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.65);
            transform: translateY(9px);
        }

        .slider-personalizado::-moz-range-thumb {
            width: 14px;
            height: 28px;
            border-radius: 5px;
            background: var(--brush-color);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.65);
            transform: translateY(9px);
        }

        /* MODO VIRTUAL: larguras, grade, espaçamento e blocos preservados */
        #container-virtual {
            display: none;
            flex-direction: column;
            width: 100%;
            align-items: center;
        }

        .cartela-virtual-wrapper {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 18px;
            width: 82vw;
            max-width: 400px;
            box-sizing: border-box;
            outline: 1px solid var(--card-outline);
            outline-offset: -1px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .cartela-header {
            display: flex;
            flex-direction: column;
            margin-bottom: 8px;
        }

        .nome-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 5px;
        }

        .nome-jogador {
            background: var(--name-bg);
            color: var(--name-text);
            padding: 3px 18px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            font-family: Georgia, serif;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: transform 0.1s;
        }

        .nome-jogador:active {
            transform: scale(0.95);
        }

        .letras-bingo {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            text-align: center;
            color: var(--card-title);
            font-size: 34px;
            font-weight: 900;
            font-family: "Segoe UI", sans-serif;
            letter-spacing: 0.04em;
            text-shadow: none;
        }

        .grade-virtual {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 4px;
            width: 100%;
            aspect-ratio: 1 / 1;
            box-sizing: border-box;
            background-color: transparent;
        }

        .btn-numero {
            min-height: 0;
            background: var(--cell-bg);
            border: none;
            border-radius: 6px;
            font-size: 21px;
            font-family: Georgia, serif;
            font-weight: 800;
            color: var(--cell-text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            padding: 0;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px var(--cell-line);
        }

        .btn-numero:hover {
            filter: none;
            transform: none;
        }

        .btn-numero span {
            position: relative;
            z-index: 3;
        }

        .btn-numero.livre {
            background: var(--free-bg);
            color: var(--free-icon);
            font-size: 30px;
            cursor: default;
        }

        .btn-numero.livre svg {
            width: 42%;
            height: 42%;
            fill: var(--free-icon);
            stroke: var(--free-stroke);
            stroke-width: 1.3;
            filter: none;
        }

        .btn-numero.livre span {
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
        }

        .btn-numero::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 85%;
            border-radius: 50%;
            background: var(--mark-bg);
            border: 1px solid var(--mark-border);
            box-shadow: none;
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 2;
        }

        .btn-numero.marcado::after {
            opacity: 1;
        }

        .controles-baixo-virtual {
            display: flex;
            width: 82vw;
            max-width: 400px;
            justify-content: space-between;
            margin-top: 15px;
            gap: 12px;
        }

        .btn-mudar-modo {
            background: var(--mode-bg);
            font-size: 14px;
            padding: 8px 15px;
            border-radius: 14px;
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.24);
        }

        /* TELAS DE CARREGAMENTO, CORTE E DIÁLOGOS */
        #loading-qr {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(4, 10, 19, 0.94);
            backdrop-filter: blur(10px);
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        .spinner {
            border: 6px solid rgba(255,255,255,0.14);
            border-top: 6px solid var(--accent);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
            box-shadow: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #cropper-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(4, 10, 19, 0.96);
            backdrop-filter: blur(10px);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .cropper-container-wrapper {
            width: 100%;
            max-width: 500px;
            height: 60vh;
            background-color: var(--panel-bg);
            margin-bottom: 20px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 0 1px var(--panel-border), 0 18px 42px rgba(0,0,0,0.46);
        }

        #image-to-crop {
            display: block;
            max-width: 100%;
        }

        .botoes-corte {
            display: flex;
            gap: 15px;
        }

        .app-dialog-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 14px;
            background: rgba(4, 10, 19, 0.82);
        }

        .app-dialog-overlay.aberto {
            display: flex;
            animation: dialog-fade 0.18s ease-out;
        }

        .app-dialog {
            width: min(100%, 340px);
            padding: 16px;
            border-radius: 16px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.42);
        }

        .app-dialog-icon {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            margin-bottom: 10px;
            border-radius: 50%;
            color: #ffffff;
            background: var(--accent);
            box-shadow: none;
        }

        .app-dialog-icon svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .app-dialog h2 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        .app-dialog p {
            margin: 0;
            padding: 10px 12px;
            color: var(--muted-text);
            background: var(--panel-inner);
            border: 1px solid var(--panel-border);
            border-radius: 11px;
            font-size: 14px;
            line-height: 1.4;
            white-space: pre-line;
        }

        .app-dialog input {
            display: none;
            width: 100%;
            height: 42px;
            margin-top: 12px;
            padding: 0 12px;
            color: var(--page-text);
            background: var(--panel-inner);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            font: inherit;
            text-transform: uppercase;
        }

        .app-dialog.tem-input input {
            display: block;
        }

        .app-dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 14px;
        }

        .app-dialog-actions button {
            min-width: 90px;
            min-height: 40px;
            padding: 9px 14px;
            border-radius: 11px;
            font-size: 14px;
        }

        .btn-dialog-cancelar {
            background: var(--panel-inner);
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.22);
        }

        .btn-dialog-confirmar {
            background: var(--action-bg);
        }

        .btn-dialog-confirmar.perigo {
            background: var(--danger-bg);
        }

        .tema-area {
            width: 100%;
            max-width: 500px;
            margin-top: 18px;
            margin-bottom: 4px;
        }

        .tema-seletor {
            display: flex;
            align-items: center;
            gap: 9px;
            width: 100%;
            min-height: 46px;
            padding: 7px 9px 7px 12px;
            color: var(--page-text);
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.22);
        }

        .tema-seletor > svg {
            width: 18px;
            height: 18px;
            flex: 0 0 18px;
            color: var(--accent);
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .tema-seletor > span {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
        }

        .tema-seletor select {
            min-width: 0;
            flex: 1;
            height: 34px;
            margin-left: auto;
            padding: 0 30px 0 10px;
            color: var(--page-text);
            background: var(--panel-inner);
            border: 1px solid var(--panel-border);
            border-radius: 9px;
            font: 600 13px "Segoe UI", sans-serif;
            cursor: pointer;
            outline: none;
        }

        .tema-seletor select:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .tema-seletor option {
            color: var(--page-text);
            background: var(--panel-bg);
        }

        @keyframes dialog-fade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 390px) {
            body {
                padding-left: 10px;
                padding-right: 10px;
            }

            .controles-topo {
                gap: 8px;
            }

            button, .input-file-btn {
                padding-left: 12px;
                padding-right: 12px;
                font-size: 14px;
            }
        }

        @media (min-width: 600px) {
            .cartela-virtual-wrapper {
                width: 90vw;
                max-width: 500px;
            }

            .nome-jogador {
                font-size: 14px;
                padding: 3px 20px;
            }

            .letras-bingo {
                font-size: 38px;
            }

            .btn-numero {
                font-size: 26px;
            }

            .btn-numero.livre {
                font-size: 36px;
            }

            .controles-baixo-virtual {
                width: 90vw;
                max-width: 500px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

    <script>
        let modoAtual = 'manual';
        let imagemOriginalSrc = null;

        const inputImagem = document.getElementById('carregarImagem');
        const btnLimpar = document.getElementById('btnLimpar');
        const loadingQr = document.getElementById('loading-qr');
        const containerVirtual = document.getElementById('container-virtual');
        const gradeBotoes = document.getElementById('grade-botoes');
        const nomeDisplay = document.getElementById('nomeDisplay');
        const btnMudarManual = document.getElementById('btnMudarManual');
        const btnDesfazerVirtual = document.getElementById('btnDesfazerVirtual');
        const containerManual = document.getElementById('container-manual');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const btnDesfazer = document.getElementById('btnDesfazer');
        const sliderPincel = document.getElementById('sliderPincel');
        const cropperModal = document.getElementById('cropper-modal');
        const imageToCrop = document.getElementById('image-to-crop');
        const btnConfirmarCorte = document.getElementById('btn-confirmar-corte');
        const btnCancelarCorte = document.getElementById('btn-cancelar-corte');
        const dialogOverlay = document.getElementById('app-dialog-overlay');
        const dialogBox = document.getElementById('app-dialog');
        const dialogTitle = document.getElementById('app-dialog-title');
        const dialogMessage = document.getElementById('app-dialog-message');
        const dialogInput = document.getElementById('app-dialog-input');
        const dialogCancelar = document.getElementById('app-dialog-cancelar');
        const dialogConfirmar = document.getElementById('app-dialog-confirmar');
        
        let cropper;
        let desenhando = false;
        let resolverDialogo = null;
        let houveInteracaoNestaSessao = false;
        
        let historico = []; 
        let historicoVirtual = []; 
        let temporizadorLeituraCartela = null;
        let identificadorLeituraCartela = 0;

        const TEMPO_LIMITE_LEITURA_CARTELA = 30000;

        const BANCO_PERSISTENCIA = 'bingoMarcadorPersistencia';
        const VERSAO_BANCO_PERSISTENCIA = 1;
        const ARMAZEM_PERSISTENCIA = 'dados';
        const CHAVE_IMAGEM_ORIGINAL = 'imagemOriginal';
        const CHAVE_ESTADO_MANUAL = 'estadoManual';
        const CHAVE_HISTORICO_MANUAL = 'historicoManual';
        const CHAVES_LOCAIS_DA_PARTIDA = [
            'bingoVirtual',
            'bingoNomeVirtual',
            'bingoHistoricoVirtual',
            'bingoModo',
            'bingoSalvoManual',
            'bingoImagemOriginal',
            'bingoHistoricoManual'
        ];

        let bancoPersistenciaPromise = null;
        let filaPersistencia = Promise.resolve();

        function abrirBancoPersistencia() {
            if (!window.indexedDB) return Promise.resolve(null);
            if (bancoPersistenciaPromise) return bancoPersistenciaPromise;

            bancoPersistenciaPromise = new Promise(resolve => {
                let pedido;
                try {
                    pedido = window.indexedDB.open(BANCO_PERSISTENCIA, VERSAO_BANCO_PERSISTENCIA);
                } catch (erro) {
                    resolve(null);
                    return;
                }

                pedido.onupgradeneeded = () => {
                    const banco = pedido.result;
                    if (!banco.objectStoreNames.contains(ARMAZEM_PERSISTENCIA)) {
                        banco.createObjectStore(ARMAZEM_PERSISTENCIA);
                    }
                };

                pedido.onsuccess = () => {
                    const banco = pedido.result;
                    banco.onversionchange = () => banco.close();
                    resolve(banco);
                };

                pedido.onerror = () => resolve(null);
                pedido.onblocked = () => resolve(null);
            });

            return bancoPersistenciaPromise;
        }

        async function gravarDadoPersistente(chave, valor) {
            const banco = await abrirBancoPersistencia();
            if (!banco) return false;

            return new Promise(resolve => {
                let transacao;
                try {
                    transacao = banco.transaction(ARMAZEM_PERSISTENCIA, 'readwrite');
                    transacao.objectStore(ARMAZEM_PERSISTENCIA).put(valor, chave);
                } catch (erro) {
                    resolve(false);
                    return;
                }

                transacao.oncomplete = () => resolve(true);
                transacao.onerror = () => resolve(false);
                transacao.onabort = () => resolve(false);
            });
        }

        async function lerDadoPersistente(chave) {
            const banco = await abrirBancoPersistencia();
            if (!banco) return null;

            return new Promise(resolve => {
                let pedido;
                try {
                    const transacao = banco.transaction(ARMAZEM_PERSISTENCIA, 'readonly');
                    pedido = transacao.objectStore(ARMAZEM_PERSISTENCIA).get(chave);
                } catch (erro) {
                    resolve(null);
                    return;
                }

                pedido.onsuccess = () => resolve(pedido.result ?? null);
                pedido.onerror = () => resolve(null);
            });
        }

        async function apagarDadosGrandesDaPartida() {
            const banco = await abrirBancoPersistencia();
            if (!banco) return false;

            return new Promise(resolve => {
                let transacao;
                try {
                    transacao = banco.transaction(ARMAZEM_PERSISTENCIA, 'readwrite');
                    const armazem = transacao.objectStore(ARMAZEM_PERSISTENCIA);
                    armazem.delete(CHAVE_IMAGEM_ORIGINAL);
                    armazem.delete(CHAVE_ESTADO_MANUAL);
                    armazem.delete(CHAVE_HISTORICO_MANUAL);
                } catch (erro) {
                    resolve(false);
                    return;
                }

                transacao.oncomplete = () => resolve(true);
                transacao.onerror = () => resolve(false);
                transacao.onabort = () => resolve(false);
            });
        }

        function enfileirarPersistencia(operacao) {
            const tarefa = filaPersistencia
                .catch(() => null)
                .then(operacao)
                .catch(() => false);
            filaPersistencia = tarefa.then(() => null);
            return tarefa;
        }

        function lerLocalSeguro(chave, interpretarJson = false) {
            try {
                const valor = localStorage.getItem(chave);
                if (valor === null) return null;
                return interpretarJson ? JSON.parse(valor) : valor;
            } catch (erro) {
                return null;
            }
        }

        function gravarLocalSeguro(chave, valor) {
            try {
                localStorage.setItem(chave, valor);
                return true;
            } catch (erro) {
                return false;
            }
        }

        function removerLocalSeguro(chave) {
            try {
                localStorage.removeItem(chave);
            } catch (erro) {}
        }

        async function solicitarArmazenamentoDuradouro() {
            try {
                if (navigator.storage && typeof navigator.storage.persist === 'function') {
                    await navigator.storage.persist();
                }
            } catch (erro) {}
        }

        async function persistirImagemOriginal() {
            const imagemParaSalvar = imagemOriginalSrc;
            if (!imagemParaSalvar) return false;

            return enfileirarPersistencia(async () => {
                const salvouNoBanco = await gravarDadoPersistente(
                    CHAVE_IMAGEM_ORIGINAL,
                    imagemParaSalvar
                );

                if (salvouNoBanco) {
                    removerLocalSeguro('bingoImagemOriginal');
                } else {
                    gravarLocalSeguro('bingoImagemOriginal', imagemParaSalvar);
                }

                return salvouNoBanco;
            });
        }

        async function carregarImagemOriginalPersistida() {
            const imagemDoBanco = await lerDadoPersistente(CHAVE_IMAGEM_ORIGINAL);
            if (typeof imagemDoBanco === 'string' && imagemDoBanco) return imagemDoBanco;
            return lerLocalSeguro('bingoImagemOriginal');
        }

        function persistirEstadoManual(estadoAtual) {
            const historicoParaSalvar = historico.slice();

            return enfileirarPersistencia(async () => {
                const salvouEstado = await gravarDadoPersistente(
                    CHAVE_ESTADO_MANUAL,
                    estadoAtual
                );
                const salvouHistorico = await gravarDadoPersistente(
                    CHAVE_HISTORICO_MANUAL,
                    historicoParaSalvar
                );

                gravarLocalSeguro('bingoSalvoManual', estadoAtual);

                if (salvouHistorico) {
                    removerLocalSeguro('bingoHistoricoManual');
                } else {
                    gravarLocalSeguro(
                        'bingoHistoricoManual',
                        JSON.stringify(historicoParaSalvar)
                    );
                }

                return salvouEstado && salvouHistorico;
            });
        }

        async function carregarPersistenciaManual() {
            let estadoAtual = await lerDadoPersistente(CHAVE_ESTADO_MANUAL);
            let historicoSalvo = await lerDadoPersistente(CHAVE_HISTORICO_MANUAL);

            if (typeof estadoAtual !== 'string' || !estadoAtual) {
                estadoAtual = lerLocalSeguro('bingoSalvoManual');
            }

            if (!Array.isArray(historicoSalvo)) {
                historicoSalvo = lerLocalSeguro('bingoHistoricoManual', true);
            }

            const historicoValido = Array.isArray(historicoSalvo)
                ? historicoSalvo.filter(item => typeof item === 'string' && item)
                : [];

            if (historicoValido.length === 0 && estadoAtual) {
                historicoValido.push(estadoAtual);
            }

            if (!estadoAtual && historicoValido.length > 0) {
                estadoAtual = historicoValido[historicoValido.length - 1];
            }

            return { estadoAtual, historicoSalvo: historicoValido };
        }

        async function limparPersistenciaDaPartida() {
            await enfileirarPersistencia(apagarDadosGrandesDaPartida);
            CHAVES_LOCAIS_DA_PARTIDA.forEach(removerLocalSeguro);
        }

        ctx.strokeStyle = corDoTemaComAlpha('--brush-color', 0.85);
        ctx.lineWidth = 20; 
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        document.addEventListener('pointerdown', () => {
            houveInteracaoNestaSessao = true;
        }, { once: true, capture: true });
        document.addEventListener('keydown', () => {
            houveInteracaoNestaSessao = true;
        }, { once: true, capture: true });

        const temasDisponiveis = new Set([
            'classico',
            'miniapp',
            'rubi',
            'oceano',
            'esmeralda',
            'violeta',
            'dourado',
            'rosa',
            'menta',
            'grafite',
            'grafite_azul',
            'grafite_lima',
            'azul_amarelo',
            'vinho_dourado',
            'lavanda_coral'
        ]);
        const coresMarcadorDisponiveis = new Set([
            'vermelho',
            'azul',
            'laranja',
            'verde',
            'roxo',
            'magenta',
            'ciano',
            'amarelo'
        ]);

        function corDoTemaComAlpha(nomeVariavel, alpha) {
            const cor = getComputedStyle(document.documentElement)
                .getPropertyValue(nomeVariavel)
                .trim();
            const hexadecimal = /^#([0-9a-f]{6})$/i.exec(cor);
            if (!hexadecimal) return cor;

            const valor = hexadecimal[1];
            const vermelho = parseInt(valor.slice(0, 2), 16);
            const verde = parseInt(valor.slice(2, 4), 16);
            const azul = parseInt(valor.slice(4, 6), 16);
            return `rgba(${vermelho}, ${verde}, ${azul}, ${alpha})`;
        }

        function aplicarTema(nomeTema, salvar = true) {
            const tema = temasDisponiveis.has(nomeTema) ? nomeTema : 'classico';
            document.documentElement.dataset.tema = tema;

            const estilos = getComputedStyle(document.documentElement);
            const corDoFundo = estilos.getPropertyValue('--page-bg').trim();
            const metaTema = document.querySelector('meta[name="theme-color"]');
            if (metaTema && corDoFundo) metaTema.content = corDoFundo;

            ctx.strokeStyle = corDoTemaComAlpha('--brush-color', 0.85);

            if (salvar) {
                try {
                    localStorage.setItem('bingoTema', tema);
                } catch (erro) {}
            }

            document.dispatchEvent(new CustomEvent('bingo-theme-change', {
                detail: { tema }
            }));
        }

        function aplicarCorMarcador(nomeCor, salvar = true) {
            const cor = coresMarcadorDisponiveis.has(nomeCor) ? nomeCor : 'vermelho';
            document.documentElement.dataset.marcador = cor;
            ctx.strokeStyle = corDoTemaComAlpha('--brush-color', 0.88);

            if (salvar) {
                try {
                    localStorage.setItem('bingoCorMarcador', cor);
                } catch (erro) {}
            }

            document.dispatchEvent(new CustomEvent('bingo-marker-change', {
                detail: { cor }
            }));
        }

        aplicarTema(document.documentElement.dataset.tema || 'classico', false);
        aplicarCorMarcador(document.documentElement.dataset.marcador || 'vermelho', false);
        window.aplicarTema = aplicarTema;
        window.aplicarCorMarcador = aplicarCorMarcador;

        function finalizarDialogo(valor) {
            if (!resolverDialogo) return;
            const resolver = resolverDialogo;
            resolverDialogo = null;
            dialogOverlay.classList.remove('aberto');
            dialogBox.classList.remove('tem-input');
            dialogConfirmar.classList.remove('perigo');
            resolver(valor);
        }

        function abrirDialogo({
            titulo,
            mensagem,
            valorInicial = null,
            textoConfirmar = 'Confirmar',
            textoCancelar = 'Cancelar',
            perigo = false
        }) {
            if (resolverDialogo) finalizarDialogo(null);

            dialogTitle.textContent = titulo;
            dialogMessage.textContent = mensagem;
            dialogConfirmar.textContent = textoConfirmar;
            dialogCancelar.textContent = textoCancelar;
            dialogConfirmar.classList.toggle('perigo', perigo);

            const temInput = valorInicial !== null;
            dialogBox.classList.toggle('tem-input', temInput);
            dialogInput.value = temInput ? valorInicial : '';
            dialogOverlay.classList.add('aberto');

            requestAnimationFrame(() => {
                if (temInput) {
                    dialogInput.focus();
                    dialogInput.select();
                } else {
                    dialogConfirmar.focus();
                }
            });

            return new Promise(resolve => {
                resolverDialogo = resolve;
            });
        }

        dialogCancelar.addEventListener('click', () => finalizarDialogo(null));
        dialogConfirmar.addEventListener('click', () => {
            const valor = dialogBox.classList.contains('tem-input') ? dialogInput.value : true;
            finalizarDialogo(valor);
        });
        dialogOverlay.addEventListener('click', (e) => {
            if (e.target === dialogOverlay) finalizarDialogo(null);
        });
        document.addEventListener('keydown', (e) => {
            if (!dialogOverlay.classList.contains('aberto')) return;
            if (e.key === 'Escape') finalizarDialogo(null);
            if (e.key === 'Enter' && document.activeElement === dialogInput) {
                e.preventDefault();
                finalizarDialogo(dialogInput.value);
            }
        });

        function criarIconeLivre() {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 24 24');
            svg.setAttribute('aria-hidden', 'true');

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', 'M12 2.8c.7 5.4 3.8 8.5 9.2 9.2-5.4.7-8.5 3.8-9.2 9.2-.7-5.4-3.8-8.5-9.2-9.2 5.4-.7 8.5-3.8 9.2-9.2z');
            svg.appendChild(path);
            return svg;
        }

        function mudarTamanho(novoTamanho, elemento) {
            ctx.lineWidth = novoTamanho;
            sliderPincel.value = novoTamanho;
            gravarLocalSeguro('bingoEspessuraPincel', String(novoTamanho));
            document.querySelectorAll('.btn-tamanho').forEach(btn => btn.classList.remove('ativo'));
            elemento.classList.add('ativo');
        }

        sliderPincel.addEventListener('input', (e) => {
            ctx.lineWidth = e.target.value;
            gravarLocalSeguro('bingoEspessuraPincel', String(e.target.value));
            document.querySelectorAll('.btn-tamanho').forEach(btn => btn.classList.remove('ativo'));
        });

        function restaurarEspessuraPincel() {
            const espessuraSalva = Number(lerLocalSeguro('bingoEspessuraPincel'));
            if (!Number.isFinite(espessuraSalva) || espessuraSalva < 5 || espessuraSalva > 115) {
                return;
            }

            sliderPincel.value = String(espessuraSalva);
            ctx.lineWidth = espessuraSalva;

            const tamanhosPredefinidos = [7, 20, 40];
            document.querySelectorAll('.btn-tamanho').forEach((btn, indice) => {
                btn.classList.toggle('ativo', tamanhosPredefinidos[indice] === espessuraSalva);
            });
        }

        async function editarNome() {
            let nomeAtual = nomeDisplay.innerText;
            if (nomeAtual === "JOGADOR") nomeAtual = "";
            
            const novoNome = await abrirDialogo({
                titulo: 'Corrigir nome',
                mensagem: 'Corrija o seu nome para a cartela:',
                valorInicial: nomeAtual,
                textoConfirmar: 'Salvar'
            });
            if (novoNome !== null && novoNome.trim() !== "") {
                nomeDisplay.innerText = novoNome.trim().toUpperCase();
                gravarLocalSeguro('bingoNomeVirtual', nomeDisplay.innerText);
            }
        }

        function cancelarTempoLimiteLeitura() {
            if (temporizadorLeituraCartela !== null) {
                clearTimeout(temporizadorLeituraCartela);
                temporizadorLeituraCartela = null;
            }
        }

        async function mostrarAvisoDeLeitura(mensagem) {
            const recarregar = await abrirDialogo({
                titulo: 'Leitura interrompida',
                mensagem,
                textoConfirmar: 'Recarregar agora',
                textoCancelar: 'Fechar'
            });

            if (recarregar) {
                window.location.reload();
            }
        }

        function iniciarTempoLimiteLeitura(identificador) {
            cancelarTempoLimiteLeitura();
            temporizadorLeituraCartela = setTimeout(() => {
                if (identificador !== identificadorLeituraCartela) return;

                identificadorLeituraCartela += 1;
                temporizadorLeituraCartela = null;
                loadingQr.style.display = 'none';
                mostrarAvisoDeLeitura(
                    'A leitura da cartela demorou mais de 30 segundos. Recarregue a página e tente novamente.'
                );
            }, TEMPO_LIMITE_LEITURA_CARTELA);
        }

        function concluirLeituraComErro(identificador) {
            if (identificador !== identificadorLeituraCartela) return;

            identificadorLeituraCartela += 1;
            cancelarTempoLimiteLeitura();
            loadingQr.style.display = 'none';
            mostrarAvisoDeLeitura(
                'Não foi possível carregar o leitor da cartela. Recarregue a página e tente novamente.'
            );
        }

        function lerQRCode(src, callback) {
            const img = new Image();
            let finalizado = false;

            const concluir = resultado => {
                if (finalizado) return;
                finalizado = true;
                callback(resultado);
            };

            img.onload = () => {
                try {
                    if (typeof window.jsQR !== 'function') {
                        throw new Error('Leitor QR indisponível');
                    }

                    const cvs = document.createElement('canvas');
                    cvs.width = img.width;
                    cvs.height = img.height;
                    const ctxTemp = cvs.getContext('2d');
                    if (!ctxTemp) throw new Error('Canvas indisponível');

                    ctxTemp.drawImage(img, 0, 0, cvs.width, cvs.height);
                    const imageData = ctxTemp.getImageData(0, 0, cvs.width, cvs.height);
                    const codigo = window.jsQR(
                        imageData.data,
                        imageData.width,
                        imageData.height,
                        { inversionAttempts: 'dontInvert' }
                    );

                    concluir(
                        codigo
                            ? { sucesso: true, dados: codigo.data }
                            : { sucesso: false }
                    );
                } catch (erro) {
                    concluir({ sucesso: false, erroLeitura: true });
                }
            };

            img.onerror = () => concluir({ sucesso: false, erroLeitura: true });
            img.src = src;
        }

        inputImagem.addEventListener('change', function(e) {
            if (!e.target.files[0]) return;

            const identificador = ++identificadorLeituraCartela;
            loadingQr.style.display = 'flex';
            iniciarTempoLimiteLeitura(identificador);
            solicitarArmazenamentoDuradouro();

            const file = e.target.files[0];
            const reader = new FileReader();
            
            reader.onload = async function(event) {
                if (identificador !== identificadorLeituraCartela) return;

                imagemOriginalSrc = event.target.result;
                await persistirImagemOriginal();
                if (identificador !== identificadorLeituraCartela) return;
                
                lerQRCode(imagemOriginalSrc, (resultado) => {
                    if (identificador !== identificadorLeituraCartela) return;

                    cancelarTempoLimiteLeitura();
                    loadingQr.style.display = 'none';

                    if (resultado.erroLeitura) {
                        concluirLeituraComErro(identificador);
                        return;
                    }

                    identificadorLeituraCartela += 1;
                    
                    if(resultado.sucesso) {
                        try {
                            const partes = resultado.dados.split('|');
                            if(partes.length >= 3) {
                                const numeros = partes[1].split(',').map(Number);
                                const nome = partes[2];
                                
                                if(numeros.length === 24) {
                                    iniciarModoVirtual(numeros, nome);
                                } else {
                                    iniciarModoManualPlanoB(imagemOriginalSrc);
                                }
                            } else {
                                iniciarModoManualPlanoB(imagemOriginalSrc);
                            }
                        } catch (err) {
                            iniciarModoManualPlanoB(imagemOriginalSrc);
                        }
                    } else {
                        iniciarModoManualPlanoB(imagemOriginalSrc);
                    }
                });
            }

            reader.onerror = () => concluirLeituraComErro(identificador);
            reader.onabort = () => concluirLeituraComErro(identificador);
            reader.readAsDataURL(file);
            e.target.value = ''; 
        });

        function guardarEstadoNoHistoricoVirtual() {
            const botoes = document.querySelectorAll('.btn-numero');
            const estado = Array.from(botoes).map(btn => btn.classList.contains('marcado'));
            historicoVirtual.push(JSON.stringify(estado));
            gravarLocalSeguro('bingoHistoricoVirtual', JSON.stringify(historicoVirtual));
        }

        btnDesfazerVirtual.addEventListener('click', () => {
            while (historicoVirtual.length > 0) {
                const estadoAnteriorStr = historicoVirtual.pop();
                let estadoAnterior;
                try {
                    estadoAnterior = JSON.parse(estadoAnteriorStr);
                } catch (erro) {
                    continue;
                }

                if (!Array.isArray(estadoAnterior)) continue;

                const botoes = document.querySelectorAll('.btn-numero');
                botoes.forEach((btn, index) => {
                    btn.classList.toggle('marcado', Boolean(estadoAnterior[index]));
                });

                gravarLocalSeguro(
                    'bingoHistoricoVirtual',
                    JSON.stringify(historicoVirtual)
                );
                salvarEstadoVirtual();
                break;
            }
        });

        function iniciarModoVirtual(numeros, nome) {
            modoAtual = 'virtual';
            containerManual.style.display = 'none';
            containerVirtual.style.display = 'flex';
            
            nomeDisplay.innerText = nome;
            gradeBotoes.innerHTML = '';
            
            // Limpa o histórico virtual de cartelas antigas
            historicoVirtual = []; 
            removerLocalSeguro('bingoHistoricoVirtual');
            
            let numIndex = 0;

            for(let i = 0; i < 25; i++) {
                const btn = document.createElement('button');
                btn.className = 'btn-numero';
                btn.dataset.indice = i;

                const spanText = document.createElement('span');

                if(i === 12) {
                    spanText.appendChild(criarIconeLivre());
                    btn.classList.add('livre');
                } else {
                    spanText.innerText = numeros[numIndex];
                    numIndex++;
                }

                btn.appendChild(spanText);

                btn.addEventListener('click', function() {
                    // TRAVA NOVA: Só marca se não estiver marcado E não for a casa livre
                    if (!this.classList.contains('marcado') && !this.classList.contains('livre')) {
                        guardarEstadoNoHistoricoVirtual();
                        this.classList.add('marcado');
                        salvarEstadoVirtual();
                    }
                });
                gradeBotoes.appendChild(btn);
            }
            
            gravarLocalSeguro('bingoModo', 'virtual');
            gravarLocalSeguro('bingoNomeVirtual', nome);
            salvarEstadoVirtual();
        }

        function salvarEstadoVirtual() {
            const botoes = document.querySelectorAll('.btn-numero');
            const estado = Array.from(botoes).map(btn => ({
                texto: btn.classList.contains('livre') ? '' : btn.querySelector('span').innerText,
                marcado: btn.classList.contains('marcado'),
                livre: btn.classList.contains('livre')
            }));
            gravarLocalSeguro('bingoVirtual', JSON.stringify(estado));
        }

        function restaurarEstadoVirtual(estadoSalvo, nomeSalvo) {
            modoAtual = 'virtual';
            containerManual.style.display = 'none';
            containerVirtual.style.display = 'flex';
            
            nomeDisplay.innerText = nomeSalvo || "JOGADOR";
            gradeBotoes.innerHTML = '';
            
            // Tenta recuperar o histórico salvo ou inicia um novo
            const histSalvo = lerLocalSeguro('bingoHistoricoVirtual', true);
            historicoVirtual = Array.isArray(histSalvo)
                ? histSalvo.filter(item => typeof item === 'string')
                : [];

            const estado = JSON.parse(estadoSalvo);
            estado.forEach((item, i) => {
                const btn = document.createElement('button');
                btn.className = 'btn-numero';
                btn.dataset.indice = i;
                
                const spanText = document.createElement('span');
                if (item.livre) {
                    spanText.appendChild(criarIconeLivre());
                } else {
                    spanText.innerText = item.texto;
                }
                btn.appendChild(spanText);

                if(item.livre) btn.classList.add('livre');
                if(item.marcado) btn.classList.add('marcado');
                
                btn.addEventListener('click', function() {
                    // TRAVA NOVA NA RESTAURAÇÃO TAMBÉM
                    if (!this.classList.contains('marcado') && !this.classList.contains('livre')) {
                        guardarEstadoNoHistoricoVirtual(); 
                        this.classList.add('marcado');
                        salvarEstadoVirtual();
                    }
                });
                gradeBotoes.appendChild(btn);
            });
        }

        btnMudarManual.addEventListener('click', async () => {
            const confirmou = await abrirDialogo({
                titulo: 'Atenção!',
                mensagem: 'Ao mudar para o Modo Pincel, perderá as marcações virtuais atuais.\n\nDeseja continuar?',
                perigo: true
            });
            if (confirmou) {
                if (!imagemOriginalSrc) {
                    imagemOriginalSrc = await carregarImagemOriginalPersistida();
                }

                if(imagemOriginalSrc) {
                    iniciarModoManualPlanoB(imagemOriginalSrc);
                } else {
                    await abrirDialogo({
                        titulo: 'Cartela não encontrada',
                        mensagem: 'A imagem original desta cartela pertence a uma versão antiga e não pôde ser recuperada. Carregue a cartela novamente.',
                        textoConfirmar: 'Entendi',
                        textoCancelar: 'Fechar'
                    });
                }
            }
        });

        function iniciarModoManualPlanoB(srcImagem) {
            imagemOriginalSrc = srcImagem;
            persistirImagemOriginal();
            modoAtual = 'manual';
            containerVirtual.style.display = 'none';
            containerManual.style.display = 'flex';
            gravarLocalSeguro('bingoModo', 'manual');

            const tempImg = new Image();
            tempImg.onload = function() {
                if (tempImg.width === tempImg.height) {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(tempImg, 0, 0, canvas.width, canvas.height);
                    historico = [];
                    salvarEstadoManual();
                } else {
                    imageToCrop.src = srcImagem;
                    cropperModal.style.display = 'flex';
                    if (cropper) { cropper.destroy(); }
                    cropper = new Cropper(imageToCrop, {
                        aspectRatio: 1 / 1,
                        viewMode: 1,
                        dragMode: 'move',
                        background: false
                    });
                }
            };
            tempImg.src = srcImagem;
        }

        btnConfirmarCorte.addEventListener('click', () => {
            const canvasCortado = cropper.getCroppedCanvas({ width: 1000, height: 1000 });
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(canvasCortado, 0, 0, canvas.width, canvas.height);
            cropperModal.style.display = 'none';
            historico = [];
            salvarEstadoManual();
        });

        btnCancelarCorte.addEventListener('click', () => {
            cropperModal.style.display = 'none';
            if (cropper) { cropper.destroy(); }
        });

        function getPosicaoManual(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function iniciarDesenho(e) {
            if(modoAtual !== 'manual') return;
            e.preventDefault();
            desenhando = true;
            const pos = getPosicaoManual(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function desenhar(e) {
            if (!desenhando || modoAtual !== 'manual') return;
            e.preventDefault();
            const pos = getPosicaoManual(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function pararDesenho(e) {
            if (desenhando && modoAtual === 'manual') {
                e.preventDefault();
                desenhando = false;
                ctx.closePath();
                salvarEstadoManual();
            }
        }

        canvas.addEventListener('touchstart', iniciarDesenho, { passive: false });
        canvas.addEventListener('touchmove', desenhar, { passive: false });
        canvas.addEventListener('touchend', pararDesenho, { passive: false });
        canvas.addEventListener('touchcancel', pararDesenho, { passive: false });
        canvas.addEventListener('mousedown', iniciarDesenho);
        canvas.addEventListener('mousemove', desenhar);
        canvas.addEventListener('mouseup', pararDesenho);
        canvas.addEventListener('mouseout', pararDesenho);

        function salvarEstadoManual() {
            const estadoAtual = canvas.toDataURL();
            historico.push(estadoAtual);
            return persistirEstadoManual(estadoAtual);
        }

        btnDesfazer.addEventListener('click', () => {
            if (historico.length > 1) {
                historico.pop();
                const estadoAnterior = historico[historico.length - 1];
                restaurarImagemManual(estadoAnterior);
                persistirEstadoManual(estadoAnterior);
            }
        });

        // BOTÃO LIMPAR TUDO AGORA FAZ RESET TOTAL
        btnLimpar.addEventListener('click', async () => {
            const confirmou = await abrirDialogo({
                titulo: 'Limpar tudo?',
                mensagem: 'Tem a certeza que deseja limpar tudo e remover a cartela atual?',
                textoConfirmar: 'Limpar Tudo',
                perigo: true
            });
            if (confirmou) {
                // Limpa somente os dados da partida. Tema, marcador e
                // preferências visuais permanecem salvos.
                await limparPersistenciaDaPartida();
                
                historicoVirtual = [];
                historico = [];
                imagemOriginalSrc = null;
                
                modoAtual = 'manual';
                containerVirtual.style.display = 'none';
                containerManual.style.display = 'flex';
                gradeBotoes.innerHTML = '';
                nomeDisplay.innerText = 'JOGADOR';
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        });

        function restaurarImagemManual(src) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    ctx.strokeStyle = corDoTemaComAlpha('--brush-color', 0.88);
                    ctx.lineWidth = sliderPincel.value;
                    ctx.lineCap = "round";
                    ctx.lineJoin = "round";
                    resolve(true);
                };
                img.onerror = () => resolve(false);
                img.src = src;
            });
        }

        const APP_UPDATE_KEY = 'bingoAppBuildFingerprint';

        async function gerarImpressaoDigital(texto) {
            if (window.crypto && window.crypto.subtle) {
                const bytes = new TextEncoder().encode(texto);
                const digest = await window.crypto.subtle.digest('SHA-256', bytes);
                return Array.from(new Uint8Array(digest))
                    .map(byte => byte.toString(16).padStart(2, '0'))
                    .join('');
            }

            let hash = 2166136261;
            for (let i = 0; i < texto.length; i++) {
                hash ^= texto.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            return (hash >>> 0).toString(16);
        }

        async function removerServiceWorkersDesteApp() {
            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                const pastaDoApp = new URL('./', window.location.href).pathname;
                await Promise.all(
                    registrations
                        .filter(reg => {
                            const escopo = new URL(reg.scope).pathname;
                            return pastaDoApp.startsWith(escopo) || escopo.startsWith(pastaDoApp);
                        })
                        .map(reg => reg.unregister())
                );
            }
        }

        async function verificarAtualizacaoAoEntrar() {
            try {
                await removerServiceWorkersDesteApp();

                const arquivosDoApp = [
                    './index.html',
                    './styles.css',
                    './theme-system.js'
                ];
                const identificador = Date.now().toString();
                const conteudosAtuais = await Promise.all(
                    arquivosDoApp.map(async arquivo => {
                        const urlAtual = new URL(arquivo, window.location.href);
                        urlAtual.searchParams.set('_verificar', identificador);
                        const resposta = await fetch(urlAtual.href, {
                            cache: 'no-store',
                            headers: { 'Cache-Control': 'no-cache' }
                        });
                        if (!resposta.ok) throw new Error('Arquivo indisponível');
                        return resposta.text();
                    })
                );

                const novaImpressao = await gerarImpressaoDigital(conteudosAtuais.join('\n---\n'));
                const impressaoAnterior = localStorage.getItem(APP_UPDATE_KEY);

                if (!impressaoAnterior) {
                    localStorage.setItem(APP_UPDATE_KEY, novaImpressao);
                    return;
                }

                if (impressaoAnterior !== novaImpressao) {
                    // Se a pessoa já começou a usar, a atualização fica para a próxima entrada.
                    if (houveInteracaoNestaSessao) return;

                    localStorage.setItem(APP_UPDATE_KEY, novaImpressao);
                    const urlRecarregada = new URL(window.location.href);
                    urlRecarregada.searchParams.set('versao', novaImpressao.slice(0, 10));
                    window.location.replace(urlRecarregada.href);
                }
            } catch (erro) {
                // O app continua funcionando normalmente mesmo sem rede.
            }
        }

        async function restaurarModoManualPersistido() {
            modoAtual = 'manual';
            containerVirtual.style.display = 'none';
            containerManual.style.display = 'flex';

            const persistenciaManual = await carregarPersistenciaManual();
            historico = persistenciaManual.historicoSalvo;

            if (persistenciaManual.estadoAtual) {
                await restaurarImagemManual(persistenciaManual.estadoAtual);
                persistirEstadoManual(persistenciaManual.estadoAtual);
            }
        }

        window.onload = async () => {
            restaurarEspessuraPincel();
            imagemOriginalSrc = await carregarImagemOriginalPersistida();

            const modoGuardado = lerLocalSeguro('bingoModo');
            if (modoGuardado === 'virtual') {
                const estadoVirtual = lerLocalSeguro('bingoVirtual');
                const nomeVirtual = lerLocalSeguro('bingoNomeVirtual');

                if (estadoVirtual) {
                    try {
                        restaurarEstadoVirtual(estadoVirtual, nomeVirtual);
                    } catch (erro) {
                        removerLocalSeguro('bingoModo');
                        await restaurarModoManualPersistido();
                    }
                } else {
                    removerLocalSeguro('bingoModo');
                    await restaurarModoManualPersistido();
                }
            } else {
                modoAtual = 'manual';
                await restaurarModoManualPersistido();
            }

            verificarAtualizacaoAoEntrar();
        };
    </script>
